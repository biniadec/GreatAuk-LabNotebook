<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/holobase-icon-32.png" />
  <link rel="apple-touch-icon" href="assets/holobase-icon-180.png" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Teacher Dashboard | HoloBase</title>
  <link rel="stylesheet" href="css/styles.css?v=holobase-3" />
  <link rel="stylesheet" href="css/theme-thylacine.css?v=holobase-1" />
</head>
<body>

  <div class="supervisor-shell">

    <div class="supervisor-header">
      <h1 data-role="dashboard-heading">Teacher Dashboard</h1>
      <div style="display:flex; gap:0.5rem;">
        <a href="index.html" class="btn btn-secondary btn-small" data-role="holobase-home-link">HoloBase home</a>
        <a href="change-password.html" class="btn btn-secondary btn-small" data-role="change-password-link" hidden>Change password</a>
        <button type="button" class="btn btn-secondary btn-small" data-role="sign-out-btn" hidden>Sign out</button>
      </div>
    </div>

    <!-- Login form: shown when no session exists -->
    <section class="card supervisor-login-card" data-role="login-view" hidden>
      <h2 style="font-size:1.05rem;">Instructor sign in</h2>
      <form data-role="login-form">
        <div class="form-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required />
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required />
        </div>
        <div class="form-error" data-role="login-error"></div>
        <button type="submit" class="btn btn-primary" data-role="login-submit">Sign in</button>
      </form>
    </section>

    <!-- Access denied: shown ONLY when authentication succeeded and we got a
         real answer back confirming this account has no admin/teacher role.
         Never shown for a failed query — see error-view below for that. -->
    <section class="card access-denied-card" data-role="denied-view" hidden>
      <h2 style="font-size:1.05rem;">Access denied</h2>
      <p>This account is signed in but is not authorized as a teacher or administrator for any project.</p>
    </section>

    <!-- Error: shown when a database/network error prevented us from even
         determining authorization or loading project data — distinct from
         a genuine denial, so a backend problem is never mistaken for "you
         don't have access." -->
    <section class="card access-denied-card" data-role="error-view" hidden>
      <h2 style="font-size:1.05rem;">Something went wrong</h2>
      <p data-role="error-message"></p>
    </section>

    <!-- Main supervisor view: shown once authorized -->
    <section data-role="main-view" hidden>

      <p class="supervisor-meta" data-role="role-label"></p>

      <div class="identity-picker" data-role="project-picker" hidden>
        <label for="project-select" style="display:block;font-size:0.82rem;font-weight:600;color:var(--text-muted);margin:0 0 0.3rem;">Project:</label>
        <select id="project-select" data-role="project-select"></select>
      </div>

      <div data-role="teachers-note" class="supervisor-meta" hidden></div>

      <div data-role="roster-container"></div>

      <div class="identity-picker" data-role="student-picker" hidden>
        <label for="student-select" style="display:block;font-size:0.82rem;font-weight:600;color:var(--text-muted);margin:0 0 0.3rem;">Viewing student:</label>
        <select id="student-select" data-role="student-select"></select>
      </div>

      <p class="supervisor-meta" data-role="student-label"></p>

      <div class="supervisor-filters" data-role="filters-row" hidden>
        <select data-role="filter-module" aria-label="Filter by module">
          <option value="all">All modules</option>
        </select>
        <select data-role="filter-completion" aria-label="Filter by completion">
          <option value="all">Completed + incomplete</option>
          <option value="completed">Completed only</option>
          <option value="incomplete">Incomplete only</option>
        </select>
        <select data-role="filter-answer" aria-label="Filter by answer presence">
          <option value="all">Has answer + no answer</option>
          <option value="has-answer">Has answer only</option>
          <option value="no-answer">No answer only</option>
        </select>
      </div>

      <div data-role="modules-container"></div>

      <p class="supervisor-empty-state" data-role="no-data-message" hidden></p>

    </section>

  </div>

  <script src="js/modules-data.js?v=holobase-1"></script>
  <script src="js/thylacine-modules-data.js?v=holobase-1"></script>
  <script src="js/projects-data.js?v=holobase-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js?v=holobase-1"></script>
  <script src="js/supervisor.js?v=holobase-1"></script>
</body>
</html>
