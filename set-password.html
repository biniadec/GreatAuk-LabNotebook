<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Set password | Lab Notebooks</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="auth-page-shell">
    <h1>Lab Notebooks</h1>

    <section class="card" data-role="loading-view" style="text-align:center;">
      <p>Checking your link…</p>
    </section>

    <section class="card" data-role="form-view" hidden>
      <h2 style="font-size:1.05rem;">Set your password</h2>
      <form data-role="set-password-form">
        <div class="form-field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="new-password" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="form-error" data-role="set-password-error"></div>
        <button type="submit" class="btn btn-primary" data-role="set-password-submit">Set password</button>
      </form>
    </section>

    <section class="card access-denied-card" data-role="invalid-view" hidden style="text-align:center;">
      <h2 style="font-size:1.05rem;">This link is invalid or has expired</h2>
      <p>
        Password reset and invite links are single-use and expire after a while. Request a new one to
        continue.
      </p>
      <p style="margin-top:1rem;"><a class="btn btn-secondary" href="recover-password.html">Request a new link</a></p>
    </section>

    <section class="card" data-role="success-view" hidden style="text-align:center;">
      <h2 style="font-size:1.05rem;">Password set</h2>
      <p>Your password has been updated.</p>
      <p style="margin-top:1rem;"><a class="btn btn-primary" data-role="continue-link" href="index.html">Continue</a></p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/landing-page.js"></script>
  <script src="js/set-password.js"></script>
</body>
</html>
