<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/holobase-icon-32.png" />
  <link rel="apple-touch-icon" href="assets/holobase-icon-180.png" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Change password | HoloBase — Evolutionary Hologenomics Training Hub</title>
  <link rel="stylesheet" href="css/styles.css?v=holobase-3" />
  <style>body:not(.auth-ready) .auth-page-shell { display: none; }</style>
</head>
<body>

  <div class="auth-page-shell">
    <div class="platform-brand">
      <img class="platform-logo" src="assets/holobase-logo.png?v=holobase-2" width="480" height="402" alt="" />
      <h1>HoloBase</h1>
      <span class="platform-tagline">Evolutionary Hologenomics Training Hub</span>
    </div>

    <section class="card" data-role="form-view">
      <h2 style="font-size:1.05rem;">Change password</h2>
      <p class="supervisor-meta" data-role="account-name" style="margin-bottom:1rem;"></p>
      <form data-role="change-password-form">
        <div class="form-field">
          <label for="current-password">Current password</label>
          <input type="password" id="current-password" name="current-password" autocomplete="current-password" required />
        </div>
        <div class="form-field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="new-password" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="form-error" data-role="change-password-error"></div>
        <button type="submit" class="btn btn-primary" data-role="change-password-submit">Change password</button>
      </form>
      <p style="text-align:center; margin-top:0.75rem;">
        <a href="#" data-role="back-link">Back</a>
      </p>
    </section>

    <section class="card" data-role="success-view" hidden style="text-align:center;">
      <h2 style="font-size:1.05rem;">Password changed</h2>
      <p>Your password has been updated.</p>
      <p style="margin-top:1rem;"><a class="btn btn-primary" data-role="continue-link" href="index.html">Continue</a></p>
    </section>
  </div>

  <script>
    window.GreatAuk = window.GreatAuk || {};
    window.GreatAuk.ROOT_PREFIX = "";
  </script>
  <script src="js/projects-data.js?v=holobase-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js?v=holobase-1"></script>
  <script src="js/landing-page.js?v=holobase-1"></script>
  <script src="js/auth-guard.js?v=holobase-1"></script>
  <script src="js/change-password.js?v=holobase-1"></script>
</body>
</html>
